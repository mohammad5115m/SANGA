{# Suggestion lists for the controlled discovery dimensions.

   A <datalist> rather than a <select>: it steers sellers towards the platform
   vocabulary, so «کریستال» and «چینی» stop being two things in every buyer's
   search, while still accepting the long tail of real Iranian stone names. A
   closed list would make a seller unable to record the stone they actually have.

   Whatever is typed is still mapped onto a canonical term on save; see
   apps/inventory/taxonomy.py. #}
{% for kind, terms in vocabulary.items %}
  <datalist id="vocab-{{ kind }}">
    {% for term in terms %}<option value="{{ term }}"></option>{% endfor %}
  </datalist>
{% endfor %}
