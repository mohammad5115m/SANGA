{% extends "layouts/app_shell.html" %}
{% block title %}درخواست همکاری | سنگا{% endblock %}

{% block content %}
<section class="stack-lg">
  <div>
    <h1 class="page-title">درخواست همکاری</h1>
    <p class="page-lead">با {{ supplier.name }}</p>
  </div>
  <form method="post" class="panel stack-md">
    {% csrf_token %}
    <label class="field">
      <span class="field-label">{{ form.message.label }}</span>
      {{ form.message }}
    </label>
    <button class="btn btn-primary" type="submit">ارسال درخواست</button>
  </form>
</section>
{% endblock %}
