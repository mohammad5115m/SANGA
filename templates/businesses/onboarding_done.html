{% extends "layouts/onboarding_shell.html" %}

{% block title %}آماده شدید | سنگا{% endblock %}

{% block content %}
<section class="stack-lg">
  <div>
    <h1 class="page-title">{{ business.name }} آماده است</h1>
    <p class="page-lead">حالا می‌توانید اولین محصول خود را ثبت کنید.</p>
  </div>
  <div class="panel stack-md">
    <ul class="checklist">
      <li class="is-done">حساب کاربری</li>
      <li class="is-done">اطلاعات کسب‌وکار</li>
      <li>ثبت اولین محصول</li>
      <li>دعوت هم‌تیمی</li>
    </ul>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-primary btn-block" type="submit">ورود به داشبورد</button>
    </form>
  </div>
</section>
{% endblock %}
