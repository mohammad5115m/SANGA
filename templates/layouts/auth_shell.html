{% extends "base.html" %}
{% load static %}

{% block body_class %}auth-body{% endblock %}

{% block shell %}
<div class="auth-shell">

  <main class="auth-panel" id="main-content" tabindex="-1">
    <div class="brand-lockup brand-lockup-lg sanga-brand">
      <div>
        <img class="sanga-logo" src="{% static 'icons/logo.svg' %}?v=5" alt="Sang Esf" width="285" height="78">

      </div>
    </div>
    {% block content %}{% endblock %}
  </main>
</div>
{% endblock %}
